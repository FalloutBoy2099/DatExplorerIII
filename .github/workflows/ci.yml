name: CI

# Every push and pull request: the program is built and the tests run.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DatExplorerIII.sln --configuration Release

      - name: Tests
        run: dotnet test DatExplorerIII.sln --configuration Release --no-build
