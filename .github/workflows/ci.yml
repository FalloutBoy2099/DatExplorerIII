name: CI

# Every push and pull request: the format of the code and of the XAML, the translations, the build and the tests.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install XamlStyler
        run: dotnet tool install --global xamlstyler.console --version 3.2501.8

      - name: Format of the XAML
        run: xstyler -d DatExplorerIII -r -p -l Minimal

      - name: Format of the code
        run: |
          dotnet format whitespace DatExplorerIII.sln --verify-no-changes
          dotnet format style DatExplorerIII.sln --verify-no-changes

      - name: Translations
        shell: bash
        run: |
          for language in en fr de es it pt ru sv pl cs zh; do
            python Tools/validate_language.py "$language"
          done

      - name: Tests
        run: dotnet test DatExplorerIII.sln --configuration Release
